; Shikishima CoreS3 firmware compile-only project.
;
; Safe default:
;   pio run -e cores3_noflash
;
; Do not use upload/erase targets from this project without a separate
; StackChan firmware flash GO.

[platformio]
src_dir = src
include_dir = .
default_envs = cores3_noflash

[env:cores3_noflash]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -mfix-esp32-psram-cache-issue
lib_deps =
  m5stack/M5Unified
  bblanchon/ArduinoJson
  links2004/WebSockets
